apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.workspace.karmada.io
  labels:
    app: karmada-workspace-apiserver
    apiserver: "true"
spec:
  caBundle: {{caBundle}}
  group: workspace.karmada.io
  groupPriorityMinimum: 2000
  service:
    name: karmada-workspace-apiserver
    namespace: karmada-system
  version: v1alpha1
  versionPriority: 10
---
apiVersion: v1
kind: Service
metadata:
  name: karmada-workspace-apiserver
  namespace: karmada-system
spec:
  type: ExternalName
  externalName: karmada-workspace-apiserver.karmada-system.svc.cluster.local
